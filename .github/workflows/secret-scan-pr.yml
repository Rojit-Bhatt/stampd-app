# PR gate: block any credential leak from reaching the repo.
# Fail the build on any gitleaks finding — never warn-only (a silenced
# gate is worse than none; see SECURITY_RECOMMENDATIONS.md T6).
name: Secret scan (PR gate)

on:
  pull_request:
    branches: [main, security-audit-fixes, security-roadmap]
  push:
    branches: [main, security-audit-fixes, security-roadmap]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    name: gitleaks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          # fail-build true is the default in v2 for push/PR; be explicit so
          # an accidental future "report-only" config change is caught in review
          fail-build: true
