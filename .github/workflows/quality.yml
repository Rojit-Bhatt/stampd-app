name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Needed only by the gitleaks job to annotate the PR with findings.
  pull-requests: read

jobs:
  # Secret scanning on every push/PR — catches keys and tokens that slip
  # into source (or git history) before they reach a deployed environment.
  # Paired with GitHub's own secret scanning on the repo settings.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        # gitleaks CLI in detect mode on the full history — no license
        # required for private repos (the managed gitleaks-action needs a
        # paid license on private repos). Exits non-zero on any finding.
        uses: gitleaks/gitleaks-action@v2
        with:
          version: v8.21.2
        env:
          GITLEAKS_CONFIG: .github/gitleaks/gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency audit: fail the build when a known high-severity CVE affects
  # a locked dependency. Dependabot (dependabot.yml) handles the update PRs.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Audit root workspace
        run: npm audit --omit=dev --audit-level=high
      - name: Install and audit backend
        run: cd backend && npm ci && npm audit --omit=dev --audit-level=high
      - name: Install and audit frontend
        run: cd frontend && npm ci && npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    needs: [secrets, audit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run lint -w frontend
      - name: Build frontend
        run: npm run build -w frontend

  backend:
    name: Backend full test suite
    runs-on: ubuntu-latest
    needs: [secrets, audit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Every suite in backend/tests/ (all 55 files) runs end-to-end against
      # the real server.js booted on the in-memory mock DB. This replaces the
      # old hand-picked subset — auth, claims, isolation, subscription and
      # reporting regressions are all caught here.
      - name: Run full backend test suite
        run: npm test -w backend
