name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run lint -w frontend
      - name: Build frontend
        run: npm run build -w frontend

  backend:
    name: Backend focused checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tenant isolation checks
        run: npm run test:isolation -w backend
      - name: Run points checks
        run: npm run test:points -w backend
      - name: Run health endpoint check
        run: node tests/health-endpoint.js
        working-directory: backend
