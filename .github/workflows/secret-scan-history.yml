# Weekly full-history sweep. gitleaks scans the PR diff; TruffleHog scans
# every blob in every branch — full-history entropy + pattern matching with
# secret verification against live services, which kills false positives.
# Longer runtime is acceptable because this is a schedule, not a gate.
name: Secret scan (weekly history sweep)

on:
  schedule:
    # Every Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    name: TruffleHog full-history sweep
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
